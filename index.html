<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magical Gift Box Offer</title>
  <style>
    body {
      background-color: #1a0933;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    .container {
      text-align: center;
      position: relative;
    }

    /* 3D Magical Gift Box Area */
    .gift-box-container {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      cursor: pointer;
      perspective: 1000px;
    }

    /* Gift Box Base */
    .gift-box {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.5s;
    }

    .box-body {
      width: 180px;
      height: 140px;
      background: linear-gradient(135deg, #ff0055, #ff5050);
      position: absolute;
      bottom: 0;
      left: 10px;
      border-radius: 10px;
      box-shadow: 0 15px 30px rgba(255, 0, 85, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.3);
    }

    /* Vertical Ribbon */
    .box-body::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 100%;
      background: #ffd700;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
    }

    /* Box Lid (Lid Opening Animation) */
    .box-lid {
      width: 200px;
      height: 40px;
      background: linear-gradient(135deg, #ff1a66, #ff6666);
      position: absolute;
      top: 20px;
      left: 0;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      transform-origin: top;
      transition: transform 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      z-index: 10;
    }

    .box-lid::after {
      content: '';
      position: absolute;
      width: 30px;
      height: 100%;
      background: #ffd700;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Ribbon Bow on Top */
    .bow {
      width: 50px;
      height: 30px;
      background: #ffd700;
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 50% 50% 0 0;
      box-shadow: 0 0 15px #ffd700;
    }

    /* Open Box Animation State */
    .gift-box-container.open .box-lid {
      transform: rotateX(-110deg) translateY(-20px);
    }

    /* Magical Glow Effect */
    .glow {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 10px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 50px 30px #ffd700, 0 0 100px 60px #ff0055;
      opacity: 0;
      transition: opacity 0.6s ease;
      z-index: 1;
    }

    .gift-box-container.open .glow {
      opacity: 1;
    }

    /* Offer Display Card */
    .offer-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 215, 0, 0.5);
      border-radius: 20px;
      padding: 25px;
      width: 320px;
      margin: 0 auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.6s ease;
    }

    .offer-card.show {
      transform: scale(1);
      opacity: 1;
    }

    .offer-title {
      font-size: 1.4rem;
      color: #ffd700;
      margin-bottom: 10px;
    }

    .coupon-box {
      background: #fff;
      color: #333;
      padding: 10px 15px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      border: 2px dashed #ff0055;
    }

    .code {
      font-weight: bold;
      font-size: 1.2rem;
      letter-spacing: 1px;
      color: #ff0055;
    }

    .copy-btn {
      background: #ff0055;
      color: #fff;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s;
    }

    .copy-btn:hover {
      background: #d60047;
    }

    /* Timer Progress Bar */
    .timer-bar-container {
      width: 100%;
      background: rgba(255,255,255,0.2);
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 15px;
    }

    .timer-bar {
      width: 100%;
      height: 100%;
      background: #ffd700;
      transition: width 10s linear;
    }

    .timer-text {
      font-size: 0.85rem;
      color: #ddd;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Magical Gift Box -->
    <div class="gift-box-container" id="giftBox" onclick="openGift()">
      <div class="glow"></div>
      <div class="gift-box">
        <div class="box-lid">
          <div class="bow"></div>
        </div>
        <div class="box-body"></div>
      </div>
    </div>

    <!-- Offer Card -->
    <div class="offer-card" id="offerCard">
      <div class="offer-title" id="offerTitle">Special Gift Offer!</div>
      <p id="offerDesc" style="font-size: 0.95rem; margin: 5px 0;">ఈ ఆఫర్‌ను వెంటనే కాపీ చేసుకోండి!</p>
      
      <div class="coupon-box">
        <span class="code" id="couponCode">MAGIC50</span>
        <button class="copy-btn" id="copyBtn" onclick="copyCode()">Copy ID</button>
      </div>

      <!-- 10 Seconds Progress Bar -->
      <div class="timer-bar-container">
        <div class="timer-bar" id="timerBar"></div>
      </div>
      <div class="timer-text" id="timerText">మరో ఆఫర్ రాకముందే 10 సెకన్లలో కాపీ చేసుకోండి!</div>
    </div>
  </div>

  <script>
    // Sample Offers List
    const offers = [
      { code: "MAGIC50", title: "50% OFF Special Gift!", desc: "మీ తదుపరి షాపింగ్‌పై 50% తగ్గింపు పొందండి." },
      { code: "FREEGIFT2026", title: "Free Surprise Box!", desc: "ఈ కోడ్‌తో ఉచిత సర్ ప్రైజ్ గిఫ్ట్ పొందండి." },
      { code: "MEGA100", title: "₹100 Cashback Voucher", desc: "కనీసం ₹500 కొనుగోలుపై ₹100 క్యాష్‌బ్యాక్." }
    ];

    let currentOfferIndex = 0;
    let timerTimeout;

    function openGift() {
      const box = document.getElementById('giftBox');
      const card = document.getElementById('offerCard');
      
      // Open the Box Animation
      box.classList.add('open');

      // Show Card with animation
      setTimeout(() => {
        card.classList.add('show');
        loadOffer(currentOfferIndex);
      }, 400);
    }

    function loadOffer(index) {
      const offer = offers[index];
      document.getElementById('offerTitle').innerText = offer.title;
      document.getElementById('offerDesc').innerText = offer.desc;
      document.getElementById('couponCode').innerText = offer.code;

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "Copy ID";
      copyBtn.style.background = "#ff0055";

      // Reset & Start 10-Second Timer Animation
      const timerBar = document.getElementById('timerBar');
      timerBar.style.transition = 'none';
      timerBar.style.width = '100%';

      setTimeout(() => {
        timerBar.style.transition = 'width 10s linear';
        timerBar.style.width = '0%';
      }, 50);

      // Clear previous timeout if any
      clearTimeout(timerTimeout);

      // Auto-slide to Next Offer after 10 Seconds
      timerTimeout = setTimeout(() => {
        nextOffer();
      }, 10500);
    }

    function copyCode() {
      const codeText = document.getElementById('couponCode').innerText;
      navigator.clipboard.writeText(codeText);

      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = "Copied! ✓";
      copyBtn.style.background = "#28a745";
    }

    function nextOffer() {
      currentOfferIndex = (currentOfferIndex + 1) % offers.length;
      
      // Slight smooth fade out and in effect
      const card = document.getElementById('offerCard');
      card.style.opacity = '0.3';
      
      setTimeout(() => {
        loadOffer(currentOfferIndex);
        card.style.opacity = '1';
      }, 300);
    }
  </script>

</body>
</html>
