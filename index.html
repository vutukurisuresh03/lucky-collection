<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magical Gift Offer Box</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1e1e2f, #2a2a40);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: #fff;
    }

    .container {
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      backdrop-filter: blur(10px);
      max-width: 400px;
      width: 90%;
    }

    /* Gift Box Styling & Magic Effects */
    .gift-container {
      position: relative;
      margin: 20px auto;
      width: 120px;
      height: 120px;
      cursor: pointer;
    }

    .gift-box {
      width: 100%;
      height: 100%;
      background: #ff4757;
      border-radius: 10px;
      position: relative;
      box-shadow: 0 10px 20px rgba(255, 71, 87, 0.4);
      transition: transform 0.3s ease;
    }

    .gift-box:hover {
      transform: scale(1.05);
    }

    /* Ribbon */
    .gift-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 100%;
      background: #ffa502;
    }

    .gift-box::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
      width: 100%;
      height: 20px;
      background: #ffa502;
    }

    .gift-lid {
      position: absolute;
      top: -15px;
      left: -5px;
      width: 130px;
      height: 25px;
      background: #ff6b81;
      border-radius: 5px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.2);
      transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }

    /* Open Animation */
    .gift-container.open .gift-lid {
      transform: translateY(-60px) rotate(-20deg);
    }

    .gift-container.open .gift-box {
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 15px #ffa502; }
      100% { box-shadow: 0 0 35px #ff4757, 0 0 50px #ffa502; }
    }

    /* Offer Popup Content */
    .offer-card {
      display: none;
      margin-top: 20px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px stroke #ffa502;
      border-radius: 15px;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .code-box {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #ffa502;
      background: #111;
      padding: 10px 15px;
      border-radius: 8px;
      margin: 15px 0;
      display: inline-block;
      border: 1px dashed #ffa502;
    }

    .timer-text {
      font-size: 14px;
      color: #ff6b81;
      margin-bottom: 10px;
    }

    .btn {
      background: #2ed573;
      color: #fff;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #26af5f;
    }

    .btn:disabled {
      background: #57606f;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🎁 సర్ప్రైజ్ గిఫ్ట్ ఆఫర్!</h2>
    <p>మీ స్పెషల్ ఆఫర్ చూడటానికి బాక్స్ పై క్లిక్ చేయండి</p>

    <!-- Magical Gift Box -->
    <div class="gift-container" id="giftBox" onclick="openGift()">
      <div class="gift-lid"></div>
      <div class="gift-box"></div>
    </div>

    <!-- Offer Details (Hidden initially) -->
    <div class="offer-card" id="offerCard">
      <h3>🎉 అభినందనలు!</h3>
      <p>మీ ప్రమో కోడ్:</p>
      
      <div class="code-box" id="promoCode">OFFER10SEC</div>

      <div class="timer-text" id="timer">ఈ ఆఫర్ <b id="seconds">10</b> సెకన్లలో మారుతుంది...</div>

      <button class="btn" id="copyBtn" onclick="copyCode()">📋 కాపీ చేసుకోండి (Copy ID)</button>
    </div>
  </div>

  <script>
    let timeLeft = 10;
    let timerInterval;

    function openGift() {
      const gift = document.getElementById('giftBox');
      const offer = document.getElementById('offerCard');

      // Add Open Class for animation
      gift.classList.add('open');

      // Show Offer Box
      setTimeout(() => {
        offer.style.display = 'block';
        startTimer();
      }, 400);
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 10;
      document.getElementById('seconds').innerText = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('seconds').innerText = timeLeft;

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // 10 సెకన్లు పూర్తయిన తర్వాత నెక్స్ట్ ఆఫర్‌కి లేదా రీసెట్‌కి వెళ్లే లాజిక్
          document.getElementById('timer').innerText = "సమయం ముగిసింది! వేరే ఆఫర్ లోడ్ అవుతోంది...";
          
          setTimeout(() => {
            // ఆఫర్ రీసెట్ లేదా నెక్స్ట్ డిస్ప్లే
            resetOffer();
          }, 2000);
        }
      }, 1000);
    }

    function copyCode() {
      const codeText = document.getElementById('promoCode').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        const btn = document.getElementById('copyBtn');
        btn.innerText = "✅ కాపీ అయింది!";
        btn.style.background = "#1e90ff";
        
        // కొన్ని సెకన్ల తర్వాత మళ్లీ పాత టెక్స్ట్ రావడం
        setTimeout(() => {
          btn.innerText = "📋 కాపీ చేసుకోండి (Copy ID)";
          btn.style.background = "#2ed573";
        }, 3000);
      });
    }

    function resetOffer() {
      document.getElementById('offerCard').style.display = 'none';
      document.getElementById('giftBox').classList.remove('open');
      document.getElementById('timer').innerHTML = 'ఈ ఆఫర్ <b id="seconds">10</b> సెకన్లలో మారుతుంది...';
    }
  </script>

</body>
</html>
